name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Build (HTML + Tailwind)
        run: npm run build

      - name: Préfixe /<repo>/ pour les liens absolus (GitHub Pages projet)
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}"
          find dist -name '*.html' -print0 | xargs -0 perl -pi -e "s{\b(href|src)=\"/(?!/)}{\$1=\"$BASE/}g"

      # Cette préversion (xoco70.github.io/domaine-de-sabbat/) ne doit pas être indexée :
      # la production est servie depuis dist/ sur www.domainedesabbat.fr (IONOS).
      - name: Préversion non indexable
        run: |
          find dist -name '*.html' -print0 | xargs -0 perl -pi -e 's{<meta name="robots" content="[^"]*">}{<meta name="robots" content="noindex, nofollow">}g'
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: No Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
